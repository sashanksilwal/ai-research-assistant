<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a9e9e"/>
    </marker>
    <style>
      .layer { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 600; fill: #222; text-anchor: middle; }
      .mod { fill: #fff; stroke: #2b6ca3; stroke-width: 1.4; }
      .modname { font-size: 14px; font-weight: 600; fill: #1f4e79; text-anchor: middle; }
      .moddesc { font-size: 11.5px; fill: #555; text-anchor: middle; }
      .ext { fill: #eef5fb; stroke: #2b6ca3; stroke-width: 1.4; }
      .label { font-size: 12px; fill: #333; text-anchor: middle; }
      .small { font-size: 11px; fill: #666; text-anchor: middle; }
      .flow { stroke: #3a9e9e; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .flowlabel { font-size: 11.5px; fill: #2c7a7a; text-anchor: middle; font-weight: 600; }
      .icon { fill: #2b6ca3; }
    </style>
  </defs>
  <rect width="1180" height="620" fill="#fff"/>

  <!-- ===== Frontend layer ===== -->
  <rect class="layer" x="20" y="20" width="240" height="580" rx="4"/>
  <text class="title" x="140" y="48">Frontend (browser)</text>
  <!-- browser window icon -->
  <rect x="45" y="75" width="190" height="125" rx="6" fill="#fff" stroke="#2b6ca3" stroke-width="1.6"/>
  <rect x="45" y="75" width="190" height="22" rx="6" class="icon"/>
  <rect x="45" y="89" width="190" height="8" class="icon"/>
  <circle cx="57" cy="86" r="3.5" fill="#fff"/><circle cx="68" cy="86" r="3.5" fill="#fff"/><circle cx="79" cy="86" r="3.5" fill="#fff"/>
  <rect x="58" y="108" width="50" height="16" rx="3" fill="#2b6ca3"/><text x="83" y="120" font-size="10" fill="#fff" text-anchor="middle">Search</text>
  <rect x="114" y="108" width="50" height="16" rx="3" fill="#fff" stroke="#2b6ca3"/><text x="139" y="120" font-size="10" fill="#2b6ca3" text-anchor="middle">Library</text>
  <rect x="170" y="108" width="50" height="16" rx="3" fill="#fff" stroke="#2b6ca3"/><text x="195" y="120" font-size="10" fill="#2b6ca3" text-anchor="middle">Paper</text>
  <rect x="58" y="134" width="162" height="10" rx="2" fill="#dbe8f4"/>
  <rect x="58" y="152" width="162" height="8" rx="2" fill="#eef3f8"/>
  <rect x="58" y="166" width="130" height="8" rx="2" fill="#eef3f8"/>
  <rect x="58" y="180" width="145" height="8" rx="2" fill="#eef3f8"/>
  <text class="label" x="140" y="222">static/index.html · app.js · styles.css</text>
  <text class="small" x="140" y="238">vanilla JS, no build step</text>
  <!-- frontend libraries -->
  <text class="label" x="140" y="285" font-weight="600">Libraries (CDN)</text>
  <rect class="mod" x="45" y="298" width="190" height="44" rx="8"/>
  <text class="modname" x="140" y="317">marked + DOMPurify</text><text class="moddesc" x="140" y="333">safe Markdown from the LLM</text>
  <rect class="mod" x="45" y="352" width="190" height="44" rx="8"/>
  <text class="modname" x="140" y="371">KaTeX</text><text class="moddesc" x="140" y="387">math in summaries and answers</text>
  <rect class="mod" x="45" y="406" width="190" height="44" rx="8"/>
  <text class="modname" x="140" y="425">vis-network</text><text class="moddesc" x="140" y="441">citation graph</text>
  <text class="small" x="140" y="500">User: search, save, upload,</text>
  <text class="small" x="140" y="515">summarize, ask, browse graph</text>

  <!-- ===== Backend layer ===== -->
  <rect class="layer" x="300" y="20" width="460" height="380" rx="4"/>
  <text class="title" x="530" y="48">Backend (FastAPI · app/main.py)</text>
  <text class="small" x="530" y="68">/api/search · /api/papers · /api/upload · /summary · /ask · /api/graph</text>
  <!-- left column -->
  <rect class="mod" x="320" y="90" width="200" height="52" rx="10"/>
  <text class="modname" x="420" y="112">metadata.py</text><text class="moddesc" x="420" y="129">title/authors/year from uploads</text>
  <rect class="mod" x="320" y="170" width="200" height="52" rx="10"/>
  <text class="modname" x="420" y="192">analysis.py</text><text class="moddesc" x="420" y="209">summary + Q&amp;A prompts</text>
  <rect class="mod" x="320" y="330" width="200" height="52" rx="10"/>
  <text class="modname" x="420" y="352">pdf.py</text><text class="moddesc" x="420" y="369">download + PyMuPDF text</text>
  <!-- right column -->
  <rect class="mod" x="540" y="90" width="200" height="52" rx="10"/>
  <text class="modname" x="640" y="112">arxiv.py</text><text class="moddesc" x="640" y="129">search + parse results</text>
  <rect class="mod" x="540" y="170" width="200" height="52" rx="10"/>
  <text class="modname" x="640" y="192">citations.py</text><text class="moddesc" x="640" y="209">reference lists → graph edges</text>
  <rect class="mod" x="540" y="250" width="200" height="52" rx="10"/>
  <text class="modname" x="640" y="272">llm.py</text><text class="moddesc" x="640" y="289">40 s timeout, model fallback</text>
  <rect class="mod" x="540" y="330" width="200" height="52" rx="10"/>
  <text class="modname" x="640" y="352">db.py</text><text class="moddesc" x="640" y="369">SQLite access</text>
  <!-- internal arrows -->
  <path d="M520,116 H530 V276" stroke="#3a9e9e" stroke-width="2.4" fill="none"/>
  <path d="M520,196 H530" stroke="#3a9e9e" stroke-width="2.4" fill="none"/>
  <path class="flow" d="M530,276 H538"/>

  <!-- ===== Data layer ===== -->
  <rect class="layer" x="300" y="430" width="460" height="170" rx="4"/>
  <text class="title" x="530" y="458">Data (local, data/)</text>
  <!-- PDFs icon -->
  <path d="M396,482 h38 l14,14 v56 h-52 z" fill="#fff" stroke="#2b6ca3" stroke-width="1.6"/>
  <path d="M434,482 v14 h14" fill="none" stroke="#2b6ca3" stroke-width="1.6"/>
  <path d="M388,490 h38 l14,14 v56 h-52 z" fill="#fff" stroke="#2b6ca3" stroke-width="1.6"/>
  <path d="M426,490 v14 h14" fill="none" stroke="#2b6ca3" stroke-width="1.6"/>
  <text x="414" y="538" font-size="11" fill="#2b6ca3" font-weight="700" text-anchor="middle">PDF</text>
  <text class="label" x="420" y="582">data/pdfs/ (saved + uploaded)</text>
  <!-- database cylinder -->
  <path d="M600,488 v48 a40,12 0 0 0 80,0 v-48" class="icon"/>
  <ellipse cx="640" cy="488" rx="40" ry="12" fill="#3f86c4"/>
  <path d="M600,504 a40,12 0 0 0 80,0 M600,520 a40,12 0 0 0 80,0" fill="none" stroke="#fff" stroke-width="1.4" opacity=".7"/>
  <text class="label" x="640" y="570">data/app.db (SQLite)</text>
  <text class="small" x="640" y="585">papers: metadata, full text, summary, refs</text>
  <!-- down arrows -->
  <path class="flow" d="M420,382 V474"/>
  <path class="flow" d="M640,382 V472"/>

  <!-- ===== External services ===== -->
  <rect class="layer" x="840" y="20" width="320" height="580" rx="4"/>
  <text class="title" x="1000" y="48">External services</text>
  <!-- cloud shape helper: drawn per service -->
  <g>
    <rect class="ext" x="870" y="80" width="260" height="66" rx="33"/>
    <text class="modname" x="1000" y="108">arXiv API</text><text class="moddesc" x="1000" y="126">paper search + PDF downloads</text>
  </g>
  <g>
    <rect class="ext" x="870" y="166" width="260" height="66" rx="33"/>
    <text class="modname" x="1000" y="194">Semantic Scholar</text><text class="moddesc" x="1000" y="212">reference lists (batch, by arXiv id)</text>
  </g>
  <g>
    <rect class="ext" x="870" y="242" width="260" height="66" rx="33"/>
    <text class="modname" x="1000" y="270">OpenAlex</text><text class="moddesc" x="1000" y="288">reference lists (by title, uploads)</text>
  </g>
  <g>
    <rect class="ext" x="870" y="380" width="260" height="76" rx="33"/>
    <text class="modname" x="1000" y="410">Google Gemini</text><text class="moddesc" x="1000" y="428">upload metadata, summaries, Q&amp;A</text>
    <text class="moddesc" x="1000" y="444">gemini-3.5-flash-lite + fallbacks</text>
  </g>

  <!-- backend → external -->
  <path class="flow" d="M740,116 H868"/>
  <path class="flow" d="M740,190 H868"/>
  <path class="flow" d="M740,204 C800,210 820,268 868,272"/>
  <path class="flow" d="M740,276 C800,280 820,410 868,414"/>

  <!-- frontend ↔ backend -->
  <path class="flow" d="M262,140 H298" marker-start="url(#arrow)"/>
  <text class="flowlabel" x="280" y="130">JSON</text>
</svg>
