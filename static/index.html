<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Research Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="logo"><span class="logo-ai">AI</span> Research Assistant</h1>
      <nav>
        <button class="tab active" data-tab="search">Search</button>
        <button class="tab" data-tab="library">Library</button>
        <button class="tab" data-tab="detail">Paper</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="search" class="panel active home">
      <form id="search-form" class="search-bar">
        <input id="search-input" type="search" placeholder="Search" required>
        <button type="submit" aria-label="Search" title="Search">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        </button>
      </form>
      <div id="search-topics" class="examples"><span class="muted">Suggested topics:</span></div>
      <p id="search-status" class="muted"></p>
      <div id="search-results" class="cards"></div>
      <!-- Decorative line drawing for the empty search page: books, a paper, a magnifying glass -->
      <svg class="search-art" aria-hidden="true" viewBox="0 0 360 250" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
        <rect x="18" y="206" width="160" height="26" rx="3"/><path d="M34 206v26M162 206v26"/>
        <rect x="30" y="180" width="140" height="26" rx="3"/><path d="M46 180v26M154 180v26M70 189h60"/>
        <rect x="12" y="154" width="150" height="26" rx="3"/><path d="M28 154v26M146 154v26M56 163h52"/>
        <path d="M44 154V96l26-8v66M70 154V84l24 6v64"/><path d="M50 104l14-4M76 96l12 3"/>
        <path d="M196 232V54h86l26 26v152z"/><path d="M282 54v26h26"/>
        <path d="M214 84h52M214 100h76M214 116h76M214 132h60M214 160h76M214 176h76M214 192h44"/>
        <circle cx="300" cy="186" r="30"/><circle cx="300" cy="186" r="23"/><path d="M322 208l26 28"/>
        <path d="M0 238h360"/>
      </svg>
    </section>
    <section id="library" class="panel">
      <form id="upload-form" class="upload-bar">
        <label for="upload-input">Upload a paper (PDF):</label>
        <input id="upload-input" type="file" accept="application/pdf,.pdf" required>
        <button type="submit">Upload</button>
        <span id="upload-status" class="muted"></span>
      </form>
      <div class="library-header">
        <p id="library-status" class="muted"></p>
        <button id="graph-toggle" type="button" class="small">Show citation graph</button>
      </div>
      <section id="graph-panel" class="card" hidden>
        <p id="graph-status" class="muted"></p>
        <div class="graph-toolbar">
          <input id="graph-search" type="search" placeholder="Highlight papers by title…">
          <label><input id="graph-orphans" type="checkbox" checked> Show unlinked papers</label>
          <label>Labels:
            <select id="graph-labels">
              <option value="0">None</option>
              <option value="5" selected>Top 5</option>
              <option value="10">Top 10</option>
              <option value="all">All</option>
            </select>
          </label>
          <span class="legend">
            <span><i style="background: var(--graph-arxiv)"></i>arXiv</span>
            <span><i style="background: var(--graph-upload)"></i>Uploaded</span>
            <span><i style="background: var(--graph-unmatched)"></i>No citation data</span>
          </span>
        </div>
        <div id="graph"></div>
      </section>
      <div id="library-list" class="cards"></div>
    </section>
    <section id="detail" class="panel">
      <div id="detail-content">
        <p class="muted">Open a paper from the Library to see it here.</p>
      </div>
    </section>
  </main>

  <!-- Markdown rendering for LLM output, sanitized before insertion -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <!-- Math in LLM output ($...$) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <!-- Citation graph rendering -->
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
