<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Research Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>AI Research Assistant</h1>
    <nav>
      <button class="tab active" data-tab="search">Search</button>
      <button class="tab" data-tab="library">Library</button>
      <button class="tab" data-tab="detail">Paper</button>
    </nav>
  </header>

  <main>
    <section id="search" class="panel active">
      <p class="muted">Search arXiv for papers. (M1)</p>
    </section>
    <section id="library" class="panel">
      <p class="muted">Saved and uploaded papers. (M2/M3)</p>
    </section>
    <section id="detail" class="panel">
      <p class="muted">Select a paper from the library to summarize it or ask questions. (M4)</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
